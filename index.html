<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Slider</title>
<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
</head>
<body>
<section class="slider">
<div class="track" id="track">
<img class="slide" src="https://commons.wikimedia.org/wiki/Special:FilePath/Mountains_of_Vorarlberg_(28919549897).jpg?width=3840" alt="Alpine mountains in Vorarlberg, Austria" loading="lazy">
<img class="slide" src="https://commons.wikimedia.org/wiki/Special:FilePath/Tuscan_Landscape_7.JPG?width=3695" alt="Rolling hills in Tuscany, Italy" loading="lazy">
<img class="slide" src="https://commons.wikimedia.org/wiki/Special:FilePath/View_from_Mt_Fyffe,_Kaikoura_Ranges,_New_Zealand.jpg?width=3840" alt="Kaikoura Ranges, New Zealand" loading="lazy">
</div>
<button class="nav prev" id="prev" aria-label="Previous image">&#8249;</button>
<button class="nav next" id="next" aria-label="Next image">&#8250;</button>
</section>

</body>
</html>
